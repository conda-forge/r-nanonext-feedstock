schema_version: 1

context:
  version: "1.10.3"

package:
  name: r-nanonext
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/nanonext_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/nanonext/nanonext_${{ version }}.tar.gz
  sha256: f025e956a290798b072ea21de68ce315f3e3d993ea95ff3a6f14e301bcffb4c5
  patches:
    - link-against-pthread-on-Windows.patch

build:
  number: 1
  script:
    - if: win
      then: R CMD INSTALL --build . %R_ARGS%
      else: R CMD INSTALL --build . ${R_ARGS}
  dynamic_linking:
    rpaths:
      - lib/R/lib/
      - lib/
    missing_dso_allowlist:
      - if: win
        then:
          - "*/R.dll"

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - cross-r-base ${{ r_base }}.*
    - if: not win
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - make
    # R on Windows builds packages with the MinGW-w64 UCRT toolchain and the
    # MSYS2 POSIX tools that R's share/make/winshlib.mk link rule relies on
    - if: win
      then:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
        - m2-filesystem
        - m2-make
        - m2-sed
        - m2-coreutils
        - m2-zip
  host:
    - r-base
  run:
    - r-base

tests:
  - r:
      libraries:
        - nanonext

about:
  homepage: https://nanonext.r-lib.org
  summary: Lightweight Toolkit for Messaging, Concurrency and the Web
  description: |-
    R binding for NNG (Nanomsg Next Gen), a successor to
    ZeroMQ. A toolkit for messaging, concurrency and the web.
    High-performance socket messaging over in-process, IPC, TCP,
    WebSocket and secure TLS transports implements 'Scalability
    Protocols', a standard for common communications patterns
    including publish/subscribe, request/reply and survey. A
    threaded concurrency framework with intuitive 'aio' objects
    that resolve automatically upon completion of asynchronous
    operations, and synchronisation primitives that allow R to wait
    on events signalled by concurrent threads. A unified HTTP
    server hosting REST endpoints, WebSocket connections and
    streaming on a single port, with a built-in HTTP client.
  license: MIT
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
    - if: win
      then:
        - NNG_LICENSE.txt
        - MBEDTLS_LICENSE.txt
  repository: https://github.com/r-lib/nanonext
  documentation: https://nanonext.r-lib.org

extra:
  recipe-maintainers:
    - conda-forge/r
    - brendanf

